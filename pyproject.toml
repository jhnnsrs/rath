[project]
name = "rath"
version = "4.2.0"
description = "async transport-agnostic graphql client"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "koil>=3.3.1",
    "graphql-core>=3.2.0,<4",
    "pydantic>2",
    # The API only: a request made inside a trace carries it on (rath.trace).
    "opentelemetry-api>=1.30",
]

[project.optional-dependencies]
websockets = ["websockets>=15"]
aiohttp = [
    "aiohttp>=3.8.2,<4",
    "certifi>2021",
]
httpx = ["httpx>=0.23.0,<0.24"]
signing = ["cryptography>=41.0.3,<42"]

[tool.hatch.build.targets.sdist]
include = ["rath"]

[tool.hatch.build.targets.wheel]
include = ["rath"]

[tool.hatch.build]
include = [
    "rath/py.typed"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["rath"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
qt_api = "pyqt5"
markers = [
    "integration: marks tests that require a running server",
    "qt: marks tests that require a running qt application",
    "public: marks tests that require a public api",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = true
branch = "main"
build_command = "uv build"

[dependency-groups]
dev = [
    "httpx>=0.23.0,<0.24",
    "autoflake>=1.7.7,<2",
    "pytest>=7.2.0,<8",
    "testcontainers>=3.7.0,<4",
    "pytest-qt>=4.2.0,<5",
    "pytest-asyncio>=0.20.2,<0.21",
    "aiohttp>=3.8.3,<4",
    "websockets>=15",
    "black>=22.10.0,<23",
    "pytest-cov>=4.0.0,<5",
    "cryptography>=41.0.3,<42",
    "pyjwt>=2.8.0,<3",
    "turms>=2.3.0",
    # `tests/test_qt.py` imports `koil.qt`, which imports qtpy. This used to
    # arrive by accident through a `fakts==1.0.0` dev-pin nothing imported;
    # removing that dead pin took qtpy with it. Ask for it directly.
    "koil[qtpy]>=3.3.3",
    "pyqt5==5.15.11",
    "python-semantic-release>=9.21.1",
    "dokker>=2.8",
    "ruff==0.17.6",
    "basedpyright==1.40.2",
]
